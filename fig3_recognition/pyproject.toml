[project]
name = "rmp-recognition"
version = "1.1.0"
description = "Trained models, held-out test sets and evaluation protocol for RMP mixed-timescale letter/direction recognition"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24,<2",
    "torch>=1.13",
    "scikit-learn>=1.2",
    "matplotlib>=3.6",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rmp_recognition"]
